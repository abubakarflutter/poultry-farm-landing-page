# Publishes the Ghani Group member app here, in a public release, so the
# web app landing page Download button (releases/latest/download/ghani-group.apk)
# always gives the newest APK.
#
# The app's source is private (abubakarflutter/poultry-farm). Its own
# "Release Android APK" workflow pushes a tag here named app-v<version>-build<n>
# whose message is the app commit; this workflow builds that commit with the
# same signing key and publishes it. It can also be run by hand.
#
# Secrets: FARM_APP_DEPLOY_KEY (read-only deploy key on poultry-farm),
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS.
name: Publish app APK

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version name, e.g. 1.1.0
        required: true
      build_number:
        description: Build number (use the app release's build number)
        required: true
      app_ref:
        description: poultry-farm commit or branch to build
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: publish-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: landing
          fetch-depth: 0

      - name: Release details
        id: v
        working-directory: landing
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            [[ "$tag" =~ ^app-v([0-9]+\.[0-9]+\.[0-9]+)-build([0-9]+)$ ]] || { echo "::error::Tag must look like app-v1.2.3-build4"; exit 1; }
            version="${BASH_REMATCH[1]}"; build="${BASH_REMATCH[2]}"
            git fetch --tags --force >/dev/null 2>&1 || true
            ref=$(git tag -l --format='%(contents:subject)' "$tag" | tr -d '[:space:]')
            ref="${ref:-main}"
          else
            version="${{ github.event.inputs.version }}"; build="${{ github.event.inputs.build_number }}"
            ref="${{ github.event.inputs.app_ref }}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3"; exit 1; }
            [[ "$build" =~ ^[0-9]+$ ]] || { echo "::error::Build number must be a whole number"; exit 1; }
            tag="app-v$version-build$build"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Ghani Group $version (build $build) from poultry-farm@$ref" >> "$GITHUB_STEP_SUMMARY"

      - name: App source (private poultry-farm repo)
        uses: actions/checkout@v4
        with:
          repository: abubakarflutter/poultry-farm
          ref: ${{ steps.v.outputs.ref }}
          path: app
          ssh-key: ${{ secrets.FARM_APP_DEPLOY_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Signing key
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - name: Build APKs
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          args="--release --build-name ${{ steps.v.outputs.version }} --build-number ${{ steps.v.outputs.build }}"
          flutter build apk $args
          flutter build apk $args --split-per-abi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          out=build/app/outputs/flutter-apk
          # Fixed names: the landing page links to releases/latest/download/ghani-group.apk.
          cp "$out/app-release.apk" "$GITHUB_WORKSPACE/dist/ghani-group.apk"
          cp "$out/app-arm64-v8a-release.apk" "$GITHUB_WORKSPACE/dist/ghani-group-arm64.apk"
          cp "$out/app-armeabi-v7a-release.apk" "$GITHUB_WORKSPACE/dist/ghani-group-arm32.apk"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum *.apk > SHA256SUMS.txt && ls -la)

      - name: Publish release
        working-directory: landing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"; b="${{ steps.v.outputs.build }}"; tag="${{ steps.v.outputs.tag }}"
          {
            echo "## Ghani Group app"
            echo
            echo "| Version | Build number |"
            echo "|---|---|"
            echo "| **$v** | **$b** |"
            echo
            echo "- \`ghani-group.apk\` works on every Android phone."
            echo "- \`ghani-group-arm64.apk\` is smaller, for most phones from the last few years."
            echo "- \`ghani-group-arm32.apk\` is for older phones."
            echo
            echo "Web app and download page: https://ghani-poultry.web.app"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$GITHUB_WORKSPACE"/dist/* --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" "$GITHUB_WORKSPACE"/dist/* \
              --title "Ghani Group $v (build $b)" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi

      - name: Remove signing key
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"
