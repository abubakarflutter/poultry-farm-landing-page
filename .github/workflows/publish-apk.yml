# Publishes the Ghani Group member app here, in a public release, so the
# web app landing page Download button (releases/latest/download/ghani-group.apk)
# always gives the newest APK.
#
# The app's source is private (abubakarflutter/poultry-farm). Its own
# "Release Android app" workflow pushes a tag here named app-v<version>-build<n>
# whose message is the app commit; this workflow builds that commit with
# `shorebird release`, signed with the same key, and publishes it. The build
# also becomes the Shorebird release that later over-the-air updates
# ("Push app update" in the app repo) are built against, so this is the only
# place the APK is built. It can also be run by hand.
#
# Secrets: FARM_APP_DEPLOY_KEY (read-only deploy key on poultry-farm),
# SHOREBIRD_TOKEN (a Shorebird API key), ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS.
# PLAY_SERVICE_ACCOUNT_JSON (Play Console service account, Release manager).
# When that secret is set, the same Shorebird build's .aab is uploaded to the
# closed-testing track. Patches stay tied to that release.
name: Publish app APK

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version name, e.g. 1.1.0
        required: true
      build_number:
        description: Build number (use the app release's build number)
        required: true
      app_ref:
        description: poultry-farm commit or branch to build
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: publish-apk
  cancel-in-progress: false

env:
  # The Flutter version Shorebird builds with; patches reuse the release's.
  FLUTTER_VERSION: 3.47.5

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: landing
          fetch-depth: 0

      - name: Release details
        id: v
        working-directory: landing
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            [[ "$tag" =~ ^app-v([0-9]+\.[0-9]+\.[0-9]+)-build([0-9]+)$ ]] || { echo "::error::Tag must look like app-v1.2.3-build4"; exit 1; }
            version="${BASH_REMATCH[1]}"; build="${BASH_REMATCH[2]}"
            git fetch --tags --force >/dev/null 2>&1 || true
            ref=$(git tag -l --format='%(contents:subject)' "$tag" | tr -d '[:space:]')
            ref="${ref:-main}"
          else
            version="${{ github.event.inputs.version }}"; build="${{ github.event.inputs.build_number }}"
            ref="${{ github.event.inputs.app_ref }}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3"; exit 1; }
            [[ "$build" =~ ^[0-9]+$ ]] || { echo "::error::Build number must be a whole number"; exit 1; }
            tag="app-v$version-build$build"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Ghani Group $version (build $build) from poultry-farm@$ref" >> "$GITHUB_STEP_SUMMARY"

      - name: App source (private poultry-farm repo)
        uses: actions/checkout@v4
        with:
          repository: abubakarflutter/poultry-farm
          ref: ${{ steps.v.outputs.ref }}
          path: app
          ssh-key: ${{ secrets.FARM_APP_DEPLOY_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # Gradle's file-system watching is for repeated builds on a developer's
      # machine. On a runner it once failed with "Caught exception: Already
      # watching path: .../android" and the build then hung until the job
      # timed out, so it stays off here.
      - name: Gradle settings for CI
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.vfs.watch=false" >> ~/.gradle/gradle.properties

      - name: Signing key
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - name: Shorebird release (signed APK)
        working-directory: app
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SHOREBIRD_TOKEN" ]; then echo "::error::SHOREBIRD_TOKEN secret is missing"; exit 1; fi
          shorebird doctor || true
          release() {
            shorebird release android \
              --artifact apk \
              --flutter-version "$FLUTTER_VERSION" \
              --build-name "${{ steps.v.outputs.version }}" \
              --build-number "${{ steps.v.outputs.build }}" \
              --no-confirm
          }
          export -f release
          # The build takes under ten minutes. One that hangs (Gradle once
          # stalled after a file-watching error) is stopped after 18 and tried
          # once more; Shorebird only records the release after a successful
          # build, so the retry is safe.
          timeout 18m bash -c release || {
            echo "::warning::shorebird release failed or hung; trying once more"
            (cd android && ./gradlew --stop) >/dev/null 2>&1 || true
            pkill -f 'GradleDaemon|GradleWrapperMain|KotlinCompileDaemon|shorebird' || true
            timeout 18m bash -c release
          }
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # Fixed name: the landing page links to releases/latest/download/ghani-group.apk.
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/ghani-group.apk"
          aab=$(find build/app/outputs -name '*.aab' -print -quit)
          if [ -z "$aab" ]; then echo "::error::Shorebird did not produce an app bundle"; exit 1; fi
          cp "$aab" "$GITHUB_WORKSPACE/dist/ghani-group.aab"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum ghani-group.apk ghani-group.aab > SHA256SUMS.txt && ls -la)

      - name: Publish release
        working-directory: landing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"; b="${{ steps.v.outputs.build }}"; tag="${{ steps.v.outputs.tag }}"
          {
            echo "## Ghani Group app"
            echo
            echo "| Version | Build number | Shorebird release |"
            echo "|---|---|---|"
            echo "| **$v** | **$b** | \`$v+$b\` |"
            echo
            echo "- \`ghani-group.apk\` works on every Android phone."
            echo "- Later improvements reach this version inside the app (restart when it says an update is ready)."
            echo
            echo "Web app and download page: https://ghani-poultry.web.app"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$GITHUB_WORKSPACE"/dist/ghani-group.apk "$GITHUB_WORKSPACE"/dist/SHA256SUMS.txt --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" "$GITHUB_WORKSPACE"/dist/ghani-group.apk "$GITHUB_WORKSPACE"/dist/SHA256SUMS.txt \
              --title "Ghani Group $v (build $b)" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi

      # Same Shorebird release as the APK above. Closed testing is the "alpha"
      # track in the Play Developer API. Skip quietly until the service account
      # secret exists, so the landing APK still publishes.
      - name: Upload the bundle to Play closed testing
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sikkafarm.poultry_farm
          releaseFiles: ${{ github.workspace }}/dist/ghani-group.aab
          track: alpha
          status: draft

      - name: Remove signing key
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"
