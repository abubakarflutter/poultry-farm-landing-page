# Deploys the landing page to Firebase Hosting (ghani-poultry.web.app)
# whenever it changes on main, or by hand.
name: Deploy landing page

on:
  push:
    branches: [main]
    paths: ['public/**', 'firebase.json', '.firebaserc']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to Firebase Hosting
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@latest deploy --only hosting --project sikka-poultry-farm --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
